services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: pipeline
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d pipeline"]
      interval: 3s
      timeout: 3s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --set
      - redpanda.auto_create_topics_enabled=true
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--brokers", "localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    command: ["serve-api"]
    environment: &pipeline-environment
      DATABASE_URL: postgres://pipeline:pipeline@postgres:5432/pipeline?sslmode=disable
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: order-events
      KAFKA_CONSUMER: order-effects-v1
      API_ADDR: :8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  relay:
    build: .
    command: ["relay"]
    environment: *pipeline-environment
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  consumer:
    build: .
    command: ["consume"]
    environment: *pipeline-environment
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  lab:
    image: nginx:1.27-alpine
    ports:
      - "8090:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  postgres-data:
  redpanda-data:
